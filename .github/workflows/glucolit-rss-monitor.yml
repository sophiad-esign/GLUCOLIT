name: GLUCOLIT / RSS monitor
run-name: GLUCOLIT daily literature update

on:
  workflow_dispatch:
  schedule:
    # 09:15 Los Angeles time during PDT. GitHub schedules are UTC.
    - cron: "15 16 * * *"

permissions:
  contents: write

concurrency:
  group: glucolit-rss-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Fetch research RSS feeds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify OpenAI secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] && [ -z "$KIMI_API_KEY" ]; then
            echo "OPENAI_API_KEY or KIMI_API_KEY is missing. Add one in GitHub repository Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Generate GLUCOLIT research posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          KIMI_MODEL: ${{ vars.KIMI_MODEL || 'moonshot-v1-8k' }}
          KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL || 'https://api.moonshot.ai/v1' }}
          UNPAYWALL_EMAIL: ${{ vars.UNPAYWALL_EMAIL || 'contact@glucolit.vercel.app' }}
        run: python scripts/glucolit_literature_monitor.py --status published --draft --limit-per-feed 20 --max-candidates 120 --min-score 3 --min-abstract-chars 220 --max-created 2 --max-llm-attempts 20 --require-openai

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## GLUCOLIT literature monitor"
            echo ""
            echo "- Schedule: daily at 09:15 Los Angeles time during PDT"
            echo "- Daily target: 2 review drafts. Candidate thresholds are intentionally broad; drafts that need more work are saved with reviewRequired: true instead of being discarded."
            echo "- Discovery: PubMed first, PubMed Central open full-text excerpts when available, plus Europe PMC and Unpaywall enrichment"
            echo "- Output: MDX drafts under \`packages/cms/src/collections/blog/content\`"
            echo "- Public safety: generated posts keep \`draft: true\` until manually reviewed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit generated posts
        run: |
          if [ -z "$(git status --porcelain packages/cms/src/collections/blog/content data/glucolit-rss-state.json)" ]; then
            echo "No new GLUCOLIT posts."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cms/src/collections/blog/content data/glucolit-rss-state.json
          git commit -m "chore: update GLUCOLIT research feed"
          git push
