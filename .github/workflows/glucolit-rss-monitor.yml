name: GLUCOLIT / RSS monitor

on:
  workflow_dispatch:
  schedule:
    # 09:15 Los Angeles time during PDT. GitHub schedules are UTC.
    - cron: "15 16 * * *"

permissions:
  contents: write

jobs:
  monitor:
    name: Fetch research RSS feeds
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Generate GLUCOLIT research posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: python scripts/glucolit_rss_monitor.py --status published --draft --min-score 8 --require-openai

      - name: Commit generated posts
        run: |
          if [ -z "$(git status --porcelain packages/cms/src/collections/blog/content data/glucolit-rss-state.json)" ]; then
            echo "No new GLUCOLIT posts."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cms/src/collections/blog/content data/glucolit-rss-state.json
          git commit -m "chore: update GLUCOLIT research feed"
          git push
